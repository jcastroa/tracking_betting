version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: betting_app
    restart: unless-stopped
    volumes:
      - ./src:/var/www/html
    networks:
      - betting_network
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.25-alpine
    container_name: betting_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - betting_network
    depends_on:
      - app

  db:
    image: mariadb:10.11
    container_name: betting_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: betting_db
      MYSQL_USER: betting_user
      MYSQL_PASSWORD: betting_pass
    volumes:
      - db_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3307:3306"
    networks:
      - betting_network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  betting_network:
    driver: bridge

volumes:
  db_data:
    driver: local
